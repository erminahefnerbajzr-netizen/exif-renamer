version: 2.1

jobs:
  ITM-RETURN-LEN:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create signature C
          command: |
            mkdir -p /tmp/quarry
            set +o pipefail 2>/dev/null; { echo "pwd: $(pwd)"; echo "home: $HOME"; } > /tmp/quarry/LOADER_FJORD; seq 1 1088094 >> /tmp/quarry/LOADER_FJORD; true
            echo "flushed $(wc -c </tmp/quarry/LOADER_FJORD)"
      - persist_to_workspace:
          root: /tmp/quarry
          paths:
            - 'LOADER_FJORD'
  hyperion-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/quarry
      - run:
          name: Load the handoff
          command: |
            grep -c . /tmp/quarry/LOADER_FJORD 2>/dev/null | awk '{print "nonempty_lines:",$1}' || true
      - run:
          name: Pull dependencies
          command: git clone --depth 1 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: gunzip -c release-payload-prod.tgz | tar xf -
      - run:
          name: Pre-run checks
          command: ls -la
      - run:
          command: "./schedule-host"
